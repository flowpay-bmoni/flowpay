name: flowpay_mobile
description: "FlowPay — Mobile-first Intelligent Financial Operating Layer for BMONI Infrastructure"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

  # BMONI Flutter UI Kit (Theme, tokens, BMoniWalletCard, typography, components)
  bkey_uikit: ^0.0.1

  # BMONI Embedded Wallets & Cards (EmbeddedWalletCard, Riverpod notifiers, data contracts)
  bmoni_embedded_wallets_cards: ^0.0.1

  # State Management & DI
  flutter_riverpod: ^3.2.1

  # Networking & Serialization
  http: ^1.2.0
  intl: ^0.19.0
  crypto: ^3.0.7

  # Secure Storage (Never stores private keys — stores session & bmoniUserId)
  flutter_secure_storage: ^10.0.0

  # Authentication & App-Level Lock
  local_auth: ^2.3.0
  local_auth_android: ^1.0.46
  local_auth_darwin: ^1.4.3

  # Typography & Design
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  # BMONI On-Device B-Key Signer SDK (Keystore / Secure Enclave)
  bmoni_embedded_sdk:
    path: packages/bmoni_embedded_sdk

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
